name: Public experiments & Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The test suite is CPU-bound: on every run, main and pull request alike, the sum of test time over wall time
  # is 2.05-2.17, so wall time is total work / ~2.1, and total work swings 960-1520 s with the hosted VM's speed
  # (measured on 9 runs, 2026-10-28). One job crossed the 12-minute ceiling on slow VMs; three shards of the
  # test files (node --test-shard) each carry a third of it, and the ceiling stays as it is.
  test:
    name: test (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On pull_request the checkout is the merge commit: depth 2 brings its parents, so the base the
          # change is judged against (scripts/latent-handoff-fences.mjs diffBase, HEAD^1) is already there.
          # At depth 1 every test file deepened the shallow clone itself and raced the others on shallow.lock,
          # which pushed PR runs past the 12-minute ceiling while main stayed near 450-600 s.
          fetch-depth: 2
      - name: Clear checked-in historical observation before this run
        run: rm -f site/data/experiments.json site/data/witnesses/*.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.11.1
      - name: Install released engine
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Re-execute all three Java fixture projects
        run: node scripts/run-roi-demos.mjs
      - name: Run public experiments
        run: pnpm experiment
      - name: Check recorded evidence and interaction failure handling (this shard)
        # The same `pnpm test` as before, its file set defined once in package.json; TEST_SHARD picks a third.
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
        run: pnpm test
  verify:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On pull_request the checkout is the merge commit: depth 2 brings its parents, so the base the
          # change is judged against (scripts/latent-handoff-fences.mjs diffBase, HEAD^1) is already there.
          # At depth 1 every test file deepened the shallow clone itself and raced the others on shallow.lock,
          # which pushed PR runs past the 12-minute ceiling while main stayed near 450-600 s.
          fetch-depth: 2
      - name: Clear checked-in historical observation before this run
        run: rm -f site/data/experiments.json site/data/witnesses/*.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.11.1
      - name: Install released engine
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Re-execute all three Java fixture projects
        run: node scripts/run-roi-demos.mjs
      - name: Keep witness receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witness-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/data/witnesses/
          retention-days: 90
      - name: Run public experiments
        run: pnpm experiment
      - name: Keep experiment record, including failed discrimination
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experiment-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/data/experiments.json
          retention-days: 90
      - name: Build and validate public site
        run: |
          pnpm build
          pnpm check
      - name: Upload Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
