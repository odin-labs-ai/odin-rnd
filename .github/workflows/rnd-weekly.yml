# "R&D floor this week" into Mattermost every Monday. Runs on the org's own runners under the org's GitHub identity
# (never on an operator laptop). Reads the committed updates feed and posts through an incoming webhook; see
# scripts/rnd-weekly.mjs.
#
# The post also carries a read-only factory-health section (scripts/rnd-factory-health.mjs): the last few runs of
# every R&D cron and the open records/data PRs nobody has landed yet, so a stuck pipeline shows up here instead of
# needing a person to go look. That needs a token that can read Actions runs on odin-labs-ai/odin-labs, which is
# PRIVATE -- this job's own GITHUB_TOKEN cannot see it. The minted token never opens, comments on or merges anything;
# only actions:read and pull-requests:read, on odin-labs and odin-rnd only.
#
# Repository configuration (name only; the value is never committed):
#   secrets.ODIN_MM_RND_WEBHOOK_URL   incoming webhook of the internal channel that receives the summary
#   secrets.ODIN_BOT_APP_ID / ODIN_BOT_APP_PRIVATE_KEY   org-level; the odin-ci-packages-bot App (rule 03 bus-factor)
name: rnd-weekly

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      week_end:
        description: 'Last UTC day of the week to report (YYYY-MM-DD); empty = yesterday'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rnd-weekly
  cancel-in-progress: false

jobs:
  summary:
    # GitHub-hosted, like publish.yml: this repo is public, and the self-hosted pool never picked up its jobs
    # (run 38654899400 sat queued). The odin-labs.ai digest uses self-hosted because that repo is private.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            site/data/updates.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Mint a read-only App token for the factory-health section (odin-labs is private; actions:read only)
        id: health-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ODIN_BOT_APP_ID }}
          private-key: ${{ secrets.ODIN_BOT_APP_PRIVATE_KEY }}
          owner: odin-labs-ai
          repositories: odin-labs,odin-rnd
          permission-actions: read
          permission-pull-requests: read
      - name: Post the weekly summary
        env:
          ODIN_MM_RND_WEBHOOK_URL: ${{ secrets.ODIN_MM_RND_WEBHOOK_URL }}
          RND_WEEK_END: ${{ inputs.week_end }}
          GH_TOKEN: ${{ steps.health-token.outputs.token }}
        run: node scripts/rnd-weekly.mjs
