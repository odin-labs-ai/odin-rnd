# Laya reproduce smoke: the "Reproduce the check." commands of site/projects/laya-browser/ run here exactly as the page
# shows them, on every platform the page says they support. scripts/laya-reproduce.mjs takes the commands from the
# page and refuses to hand them over if they differ from the README's Reproduce blocks, so docs drift turns this red.
# The page's first block (git clone ... && cd odin-rnd) is replaced by the checkout: cloning main would test main, not
# the change under review. Everything after it is the page's text, line by line, from the repository root.
# Each job names its runner literally (docs/lab-bar.md); the steps are in .github/actions/laya-reproduce.
# Not a required check: it downloads ~1.3 GB of pinned weights and rebuilds the int8 model, so it runs on demand,
# weekly, and on pull requests that touch the Laya page, its scripts or this workflow.
name: laya reproduce smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'
  pull_request:
    paths:
      - 'research/laya-browser/**'
      - 'experiments/laya-vs-jev/**'
      - 'site/projects/laya-browser/**'
      - 'scripts/laya-*.mjs'
      - '.github/workflows/laya-reproduce.yml'
      - '.github/actions/laya-reproduce/**'
permissions:
  contents: read
concurrency:
  group: laya-reproduce-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_CACHE_DIR: ${{ github.workspace }}/../pip-cache
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  platforms:
    name: platform line matches the runners below
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check the page's and README's platform sentence against the runners of the reproduce jobs
        run: node scripts/laya-reproduce.mjs --platforms

  reproduce-linux-x64:
    name: reproduce, full check (Linux x86_64, sh block)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/laya-reproduce
        with:
          shell: sh

  reproduce-linux-arm64:
    name: reproduce, full check (Linux aarch64, sh block)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/laya-reproduce
        with:
          shell: sh

  reproduce-windows-x64:
    name: reproduce, full check (Windows x64, powershell block)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/laya-reproduce
        with:
          shell: powershell

  reproduce-windows-arm64:
    name: reproduce, full check (Windows arm64, powershell block)
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/laya-reproduce
        with:
          shell: powershell

  reproduce-macos-arm64:
    name: reproduce, full check (macOS 15, Apple silicon, sh block)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/laya-reproduce
        with:
          shell: sh
