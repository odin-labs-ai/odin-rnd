# Launch drafts for every lab that landed or changed in the last week: LinkedIn, X and Discussions drafts quoting only
# the lab page's own sentences, plus the page's share card, in a dated folder (scripts/lab-launch-drafts.mjs). Runs on
# GitHub-hosted runners under the org's GitHub identity, never on a laptop. The drafts job is read-only: no secret, and
# its token holds only contents: read. upload-artifact does not use that token (it writes through the runner's own
# artifact service), as broker-probe.yml already shows in this repository: contents: read, and its runs carry their
# uploaded artifact. The LinkedIn and X drafts are uploaded for the founder to read, edit and post by hand.
#
# The post job (scripts/lab-launch-post.mjs) then posts each lab's github-discussion.md to this repository's
# Discussions, category "Show and tell", title and body exactly as generated. It uses this run's own GITHUB_TOKEN with
# discussions: write (no personal token, nothing a single person must rotate) and runs only in odin-labs-ai/odin-rnd on
# main: never on a fork, never for a pull request (this workflow has no pull_request trigger, and the job checks the
# repository and ref). Before posting it re-reads each page (200, no redirect), re-checks that every line is the page's
# own, re-runs the generator's text screen, and skips a draft whose title is already a discussion. Any refusal posts
# nothing. The schedule never posts: it only drafts. A Discussions post is a public post, and rule 36 (Public-Channel
# Posting, Guard 2) allows one only after a person has read the exact body and chosen to post it; a schedule is not that
# choice. So the post job runs only for a manual run, which is a dry run unless dry_run is unticked: the person who
# unticks it, after reading the drafts artifact, is the confirmation. Its audit (posted, skipped, refused: title,
# address, body sha256, never the body) is the step summary and an artifact.
#
# The window is the seven days before the run, matching the weekly schedule. A manual run can name labs instead
# (comma-separated catalogue slugs) or start the window on another date.
name: lab-launch-drafts

on:
  schedule:
    # Monday 07:00 UTC, after the Monday publish run (06:17) has put any new lab page live.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      labs:
        description: 'Comma-separated lab slugs to draft (e.g. same-model-harness,strangers); empty = labs changed in the window'
        required: false
        default: ''
      since:
        description: 'First UTC day of the window (YYYY-MM-DD); empty = seven days ago'
        required: false
        default: ''
      dry_run:
        description: 'Check and list only, post nothing (untick to post the Discussions)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: lab-launch-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.draft.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The whole history, so git log can say which lab pages changed in the window.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Draft the labs (reads each lab's live page; sends nothing)
        id: draft
        env:
          LABS: ${{ inputs.labs }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [ -n "$LABS" ]; then
            node scripts/lab-launch-drafts.mjs --out launch-drafts --date "$today" --labs "$LABS"
          else
            node scripts/lab-launch-drafts.mjs --out launch-drafts --date "$today" --since "${SINCE:-$(date -u -d '7 days ago' +%F)}"
          fi
          cat "launch-drafts/$today/INDEX.md" >> "$GITHUB_STEP_SUMMARY"
          echo "date=$today" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-launch-drafts-${{ steps.draft.outputs.date }}
          path: launch-drafts/
          retention-days: 90
          if-no-files-found: error

  post:
    needs: drafts
    # Only this repository, only main, only a manual run: a fork, another branch or the schedule never posts.
    if: github.repository == 'odin-labs-ai/odin-rnd' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lab-launch-drafts-${{ needs.drafts.outputs.date }}
          path: launch-drafts/
      - name: Post the Discussions drafts (manual runs only; dry unless dry_run is unticked)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Positive flag: only a manual run with dry_run unticked posts; the schedule never does. The input is compared
          # as text, because GitHub expressions coerce a missing input (null) to false: an absent dry_run is ''.
          # This workflow has exactly two triggers, schedule and workflow_dispatch (no workflow_call: a caller would lend
          # it its own event), and scripts/lab-launch-post.test.mjs pins that.
          POST: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) == 'false' }}
          DRAFT_DATE: ${{ needs.drafts.outputs.date }}
        run: |
          set -euo pipefail
          mode=--dry-run
          if [ "$POST" = "true" ]; then mode=; fi
          rc=0
          node scripts/lab-launch-post.mjs --dir "launch-drafts/$DRAFT_DATE" --repo "$GITHUB_REPOSITORY" --category 'Show and tell' --audit discussion-post-audit.json $mode || rc=$?
          { echo '### Discussions'; echo; echo '```json'; cat discussion-post-audit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab-launch-discussions-${{ needs.drafts.outputs.date }}
          path: discussion-post-audit.json
          retention-days: 90
          if-no-files-found: warn
