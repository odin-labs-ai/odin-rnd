# One platform of the laya reproduce smoke (.github/workflows/laya-reproduce.yml): the page's Reproduce block for this
# shell, run line by line from the repository root after the checkout. A composite action so that every job of the
# workflow can name its runner literally (docs/lab-bar.md: no matrix expression in runs-on).
name: laya reproduce
description: Run the Laya page's Reproduce commands for one shell, with pip and the pinned model downloads cached.
inputs:
  shell:
    description: sh (the macOS/Linux block) or powershell (the Windows block)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    # pip's own default cache folder on Linux, macOS and Windows; the commands run unchanged.
    - name: Restore the pip download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
          ~/AppData/Local/pip/Cache
        key: laya-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('research/laya-browser/requirements.txt') }}
    # The pinned checkpoint and hosted build (~1.3 GB) are the same bytes on every platform; the rebuilt ONNX files are
    # not cached, so convert.py really rebuilds and compares on every run.
    - name: Restore the pinned model downloads
      id: models
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/odin-rnd-laya/hf
          ~/.cache/odin-rnd-laya/hosted
        key: laya-models-${{ runner.os }}-${{ hashFiles('research/laya-browser/requirements.txt', 'research/laya-browser/pins.json') }}
    - name: Take the commands from the page (and check them against the README)
      shell: bash
      run: |
        ext=sh; [ "${{ inputs.shell }}" = powershell ] && ext=ps1
        node scripts/laya-reproduce.mjs --shell "${{ inputs.shell }}" --out "$RUNNER_TEMP/reproduce.$ext"
    - name: Run the page's macOS/Linux block
      if: inputs.shell == 'sh'
      shell: sh
      run: sh -ex "$RUNNER_TEMP/reproduce.sh"
    - name: Run the page's Windows block in Windows PowerShell
      if: inputs.shell == 'powershell'
      shell: powershell
      run: '& "$env:RUNNER_TEMP\reproduce.ps1"; exit $LASTEXITCODE'
    - name: Save the pinned model downloads
      if: always() && steps.models.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/odin-rnd-laya/hf
          ~/.cache/odin-rnd-laya/hosted
        key: ${{ steps.models.outputs.cache-primary-key }}
    - name: Copy the comparison report next to reference.json
      if: always()
      shell: bash
      run: cp ~/.cache/odin-rnd-laya/compare.json compare.json || true
    - name: Keep the outputs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: laya-reproduce-${{ runner.os }}-${{ runner.arch }}
        if-no-files-found: ignore
        path: |
          reference.json
          compare.json
